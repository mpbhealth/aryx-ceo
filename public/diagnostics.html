<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARYX CEO - Diagnostics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F4F1EA;
      min-height: 100vh;
      padding: 20px;
      color: #1A1410;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid #E6E0D4;
    }
    h1 {
      color: #FF5A1F;
      margin-bottom: 24px;
      font-size: 28px;
    }
    .section {
      margin-bottom: 24px;
      padding: 20px;
      background: #F8F6F1;
      border-radius: 8px;
      border-left: 4px solid #FF5A1F;
    }
    .section h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #5C564C;
    }
    .check-item {
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status.pass { background: #10b981; }
    .status.fail { background: #ef4444; }
    .status.warn { background: #f59e0b; }
    .check-label {
      flex: 1;
      font-weight: 500;
    }
    .check-value {
      color: #64748b;
      font-size: 14px;
      font-family: ui-monospace, monospace;
    }
    button {
      background: #FF5A1F;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin: 8px 8px 8px 0;
    }
    button:hover { background: #E24E18; }
    .timestamp {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ARYX CEO environment check</h1>

    <div class="section">
      <h2>Browser</h2>
      <div id="browser-checks"></div>
    </div>

    <div class="section">
      <h2>Network</h2>
      <div id="network-checks"></div>
    </div>

    <div class="section">
      <h2>Actions</h2>
      <button onclick="window.location.href='/'">Go to app</button>
      <button onclick="window.location.href='/login'">Go to login</button>
      <button onclick="window.location.reload()">Refresh</button>
    </div>

    <div class="timestamp">
      Generated: <span id="timestamp"></span>
    </div>
  </div>

  <script>
    function addCheck(containerId, label, status, value) {
      var container = document.getElementById(containerId);
      var div = document.createElement('div');
      div.className = 'check-item';
      div.innerHTML =
        '<div class="status ' + status + '"></div>' +
        '<div class="check-label">' + label + '</div>' +
        (value ? '<div class="check-value">' + value + '</div>' : '');
      container.appendChild(div);
    }

    addCheck('browser-checks', 'Window', typeof window !== 'undefined' ? 'pass' : 'fail', 'Available');
    addCheck('browser-checks', 'Document', typeof document !== 'undefined' ? 'pass' : 'fail', 'Available');
    addCheck('browser-checks', 'LocalStorage', typeof localStorage !== 'undefined' ? 'pass' : 'fail',
      typeof localStorage !== 'undefined' ? 'Available' : 'Missing');
    addCheck('browser-checks', 'Fetch', typeof fetch !== 'undefined' ? 'pass' : 'fail',
      typeof fetch !== 'undefined' ? 'Available' : 'Missing');
    addCheck('network-checks', 'Online', navigator.onLine ? 'pass' : 'fail',
      navigator.onLine ? 'Online' : 'Offline');
    addCheck('network-checks', 'URL', 'pass', window.location.href);
    addCheck('network-checks', 'Host', 'pass', window.location.host);
    document.getElementById('timestamp').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
