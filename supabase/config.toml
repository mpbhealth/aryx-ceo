# ARYX COS — linked to project kylemtjsypmrtmuhmang
project_id = "kylemtjsypmrtmuhmang"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Local only. Live Site URL is https://ceo.aryx.pro — do not config-push this localhost value.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reset-password",
  "https://ceo.aryx.pro",
  "https://ceo.aryx.pro/**",
  "https://ceo.aryx.pro/auth/callback",
  "https://ceo.aryx.pro/auth/reset-password",
  "https://cos.aryxtech.com/**",
  "https://cos.aryxtech.com/auth/callback",
  "https://cos.aryxtech.com/auth/reset-password",
  "https://aryx-ceo.vercel.app/**",
  "https://aryx-cos.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.send_email]
enabled = true
uri = "https://kylemtjsypmrtmuhmang.supabase.co/functions/v1/send-auth-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[storage]
enabled = true

[functions.email-oauth]
verify_jwt = true

[functions.email-api]
verify_jwt = true

[functions.connector-sync]
verify_jwt = false
# Authenticated by user JWT or COS_CRON_SECRET. Cron is not a license to skip org filters.

[functions.sso-exchange]
verify_jwt = false
# Ticket redemption has no COS session yet.

[functions.crm-proxy]
verify_jwt = true

[functions.mail-renewal]
verify_jwt = false
# Authenticated by MAIL_CRON_SECRET (Authorization: Bearer …). Fail closed if unset.

[functions.mail-webhook]
verify_jwt = false
# Graph handshake is public; notifications require matching clientState + subscriptionId.

[functions.send-auth-email]
verify_jwt = false

[functions.outlook-calendar]
verify_jwt = true
